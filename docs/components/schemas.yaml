# ---------------------------------------------------------------------------
# Reusable schemas — referenced via $ref throughout path definitions
# ---------------------------------------------------------------------------

# ── Generic responses ───────────────────────────────────────────────────────

SuccessMessage:
  type: object
  properties:
    status:
      type: string
      enum: [success]
    message:
      type: string

FailedMessage:
  type: object
  properties:
    status:
      type: string
      enum: [failed]
    message:
      type: string

InternalServerError:
  type: object
  properties:
    status:
      type: string
      enum: [failed]
    message:
      type: string
  example:
    status: failed
    message: Internal server error

# ── Auth user ───────────────────────────────────────────────────────────────

AuthUser:
  type: object
  properties:
    _id:
      type: string
      example: 64a1b2c3d4e5f6789012345
    email:
      type: string
      format: email
      example: user@example.com
    hasOnboarded:
      type: boolean
      example: true
    createdAt:
      type: string
      format: date-time
      example: "2023-07-01T12:00:00.000Z"
    updatedAt:
      type: string
      format: date-time
      example: "2023-07-01T12:00:00.000Z"

# ── Auth request bodies ─────────────────────────────────────────────────────

InitiateAuthBody:
  type: object
  required: [email, role]
  properties:
    email:
      type: string
      format: email
      description: User email address
      example: user@example.com
    role:
      type: string
      enum: [user, instructor]
      description: Role to assign on account creation
      example: user

VerifyPasswordBody:
  type: object
  required: [email, password]
  properties:
    email:
      type: string
      format: email
      description: User email address
      example: user@example.com
    password:
      type: string
      minLength: 6
      description: User password (min 6 characters)
      example: password123

VerifyOtpBody:
  type: object
  required: [otp]
  properties:
    otp:
      type: string
      pattern: "^[0-9]{6}$"
      description: 6-digit OTP code
      example: "123456"
    email:
      type: string
      format: email
      description: User email address (optional)
      example: user@example.com

RequestResetBody:
  type: object
  required: [email]
  properties:
    email:
      type: string
      format: email
      description: User email address
      example: user@example.com

ResetPasswordBody:
  type: object
  required: [code, password, confirmPassword]
  properties:
    code:
      type: string
      description: 6-digit reset code sent to email
      example: "123456"
    password:
      type: string
      minLength: 6
      description: New password (min 6 characters)
      example: newPassword123
    confirmPassword:
      type: string
      description: Password confirmation
      example: newPassword123
    logoutAllDevices:
      type: boolean
      description: Whether to logout all devices after password reset
      example: false

CompleteOnboardingBody:
  type: object
  required: [userId, name, password, confirmPassword]
  properties:
    userId:
      type: string
      description: ID of the user returned from OTP verification
      example: 64a1b2c3d4e5f6789012345
    name:
      type: string
      description: Display name for the new account
      example: Jane Doe
    password:
      type: string
      minLength: 6
      description: Account password to use after onboarding
      example: password123
    confirmPassword:
      type: string
      description: Password confirmation
      example: password123
